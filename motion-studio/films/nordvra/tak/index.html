<!doctype html>
<html lang="sv">
<meta charset="utf-8">
<title>Nordvra – Avdraget för 2026</title>
<style>html, body { margin: 0; background: #FAF7F2; overflow: hidden; } canvas { display: block; width: 100vw; height: 100vh; }</style>
<canvas id="c"></canvas>
<script type="module">
// Idea 1: year-end. 15 s, 120 BPM. Facts from Skatteverket ("Så fungerar rutavdraget"): 75 000 kr per
// year for RUT and ROT together; the payment date decides which tax year the deduction lands in.
import * as N from '../lib.js';
const { C, g, S, W, X, CW, TOP, BOTTOM, font, fit, lines, para, rrect, sUI, sType, count, kr, check } = N;

function intro(t) {
  const hp = fit('avdrag för 2026?', 800, 112, CW);
  let y = lines(t, ['Har du använt ditt', 'avdrag för 2026?'], -0.35, null, TOP, hp, C.ink);
  y = lines(t, ['RUT + ROT, per person och år'], 0.4, null, y + 40 * S, 40, C.muted, 600);
  // 0 → 75 000 kr.
  const k = sUI(t - 0.45);
  if (k > 0) {
    const v = count(t, 0.5, 1.5, 0, 75000);
    g.save(); g.beginPath(); g.rect(0, y, W, 200 * S); g.clip();
    g.font = font(900, 168); g.fillStyle = C.brand; g.textBaseline = 'top';
    g.fillText(kr(v) + ' kr', X - 6 * S, y + 6 * S + (1 - k) * 200 * S);
    g.restore();
  }
  y += 220 * S;
  // A calendar tile flips through December to the 31st.
  const ck = sUI(t - 1.9);
  if (ck > 0) {
    const w = 300 * S, h = Math.min(330 * S, BOTTOM - y - 10 * S);
    g.save(); g.translate(X, y + (1 - ck) * 160 * S);
    g.shadowColor = 'rgba(26,36,32,0.16)'; g.shadowBlur = 30 * S; g.shadowOffsetY = 12 * S;
    rrect(0, 0, w, h, 28 * S, C.surface); g.shadowColor = 'transparent';
    g.save(); g.beginPath(); g.roundRect(0, 0, w, h, 28 * S); g.clip();
    g.fillStyle = C.danger; g.fillRect(0, 0, w, 76 * S);
    g.font = font(800, 34); g.fillStyle = C.white; g.textBaseline = 'middle'; g.textAlign = 'center';
    g.fillText('DECEMBER', w / 2, 38 * S);
    const day = Math.max(1, Math.round(count(t, 2.0, 1.6, 1, 31)));
    g.font = font(900, 150); g.fillStyle = C.ink; g.fillText(String(day), w / 2, 76 * S + (h - 76 * S) / 2 + 6 * S);
    g.restore(); g.restore();
    g.textAlign = 'left';
    lines(t, ['Nyårsafton.', 'Sista dagen', 'att betala i år.'], 3.4, null, y + 40 * S, 52, C.ink, 800, 1.12, X + w + 44 * S);
  }
}

function rule(t, s) {
  let y = lines(t, ['Det är betaldatumet', 'som avgör vilket år', 'avdraget hamnar på.'], s + 0.1, null, TOP, fit('som avgör vilket år', 800, 96, CW), C.white);
  const k = sUI(t - (s + 1.3));
  if (k > 0) {
    const h = 200 * S, by = y + 56 * S;
    g.save(); g.translate(X, by + h / 2); g.scale(k, k); g.translate(-X, -(by + h / 2));
    rrect(X, by, CW, h, 32 * S, C.brandSoft);
    g.restore();
    lines(t, ['Betalar du före nyår', 'räknas det på 2026.'], s + 1.45, null, by + 34 * S, 60, C.brandStrong, 800, 1.1, X + 40 * S);
    y = by + h;
  }
  lines(t, ['Källa: Skatteverket'], s + 2.0, null, y + 36 * S, 30, C.brandSoft, 600);
}

function ask(t, s) {
  let y = lines(t, ['Vi frågar dig i förfrågan:'], s + 0.05, null, TOP, 44, C.muted, 600);
  const k = sUI(t - (s + 0.3));
  const cx = X, cy = y + 30 * S, cw = CW, ch = 400 * S;
  if (k > 0) {
    g.save(); g.translate(cx + cw / 2, cy + ch / 2 + (1 - k) * 180 * S); g.translate(-(cx + cw / 2), -(cy + ch / 2));
    g.shadowColor = 'rgba(26,36,32,0.14)'; g.shadowBlur = 32 * S; g.shadowOffsetY = 12 * S;
    rrect(cx, cy, cw, ch, 30 * S, C.surface); g.shadowColor = 'transparent';
    rrect(cx, cy, cw, ch, 30 * S, null, C.border, 2 * S);
    g.font = font(800, fit('Har du redan använt RUT/ROT i år?', 800, 52, cw - 80 * S)); g.fillStyle = C.ink; g.textBaseline = 'top';
    g.fillText('Har du redan använt RUT/ROT i år?', cx + 40 * S, cy + 44 * S);
    // Answer chips, as on the site; "Vet inte" gets picked.
    let bx = cx + 40 * S;
    ['Ja', 'Nej', 'Vet inte'].forEach((a, i) => {
      g.font = font(700, 40);
      const bw = g.measureText(a).width + 72 * S, bh = 92 * S, by = cy + 136 * S;
      const on = i === 2 ? sUI(t - (s + 1.1)) : 0;
      rrect(bx, by, bw, bh, 18 * S, N.mix(C.surface, C.brand, on), N.mix('#6F7A74', C.brand, on), 3 * S);
      g.fillStyle = N.mix(C.ink, C.white, on); g.textBaseline = 'middle'; g.fillText(a, bx + 36 * S, by + bh / 2);
      bx += bw + 18 * S;
    });
    const lk = sType(t - (s + 1.6));
    if (lk > 0) {
      const txt = 'Kolla hur mycket du har kvar på Skatteverkets Mina sidor';
      g.font = font(700, fit(txt, 700, 34, cw - 80 * S)); g.fillStyle = C.brand; g.textBaseline = 'top';
      g.save(); g.globalAlpha = N.clamp(lk * 1.4);
      g.fillText(txt, cx + 40 * S, cy + 278 * S + (1 - lk) * 30 * S);
      g.fillRect(cx + 40 * S, cy + 278 * S + 46 * S, g.measureText(txt).width * lk, 3 * S);
      g.restore();
    }
    g.restore();
  }
  y = cy + ch + 56 * S;
  lines(t, ['Sedan får du exakt pris', 'inom 24 timmar.'], s + 2.1, null, y, 64, C.ink);
  check(X + CW - 120 * S, y - 10 * S, 120 * S, (t - (s + 2.4)) / 0.3, C.brand, 3.2);
}

const SCENES = [
  { start: 0, bg: C.canvas, draw: intro },
  { start: 4.2, bg: C.brandStrong, draw: rule },
  { start: 8.4, bg: C.canvas, draw: ask },
  { start: 12.0, bg: C.muted2, draw: (t, s) => N.endCard(t, s, {
    head: ['Se ditt pris', 'efter avdrag.'],
    fine: ['RUT 50 % och ROT 30 % på arbetskostnaden.', 'Avdraget förutsätter att du har rätt till det.'] }) },
];
window.seek = (t) => N.bands(t, SCENES);
window.seek(0);
</script>
</html>
